name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Setup Rust
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # Install Dependencies
    - name: Install System Dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

    - name: Install NPM Dependencies
      run: |
        npm install
        npm install --prefix ratatoskr-desktop

    # Run Checks via Lefthook (or directly for simplicity in CI)
    # We run commands directly to avoid installing lefthook binary if not needed, 
    # but since we have it in package.json, we can use it or just run cargo/npm commands.
    # Running directly gives better error visibility in CI logs usually.

    - name: Check Rust Formatting
      run: cargo fmt -- --check

    - name: Lint Rust (Clippy)
      run: cargo clippy --workspace -- -D warnings

    - name: Run Rust Tests
      run: cargo test --workspace

    - name: Check Svelte (Lint & Types)
      working-directory: ./ratatoskr-desktop
      run: |
        npm run check
        npx eslint .
