# lefthook.yml

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "**/*.rs"
      run: cargo fmt -- --check
    
    rust-clippy:
      glob: "**/*.rs"
      run: cargo clippy --workspace -- -D warnings

    svelte-check:
      root: "ratatoskr-desktop"
      glob: "**/*.{svelte,ts,js}"
      run: npm run check

    eslint:
      root: "ratatoskr-desktop"
      glob: "**/*.{svelte,ts,js}"
      run: npx eslint .